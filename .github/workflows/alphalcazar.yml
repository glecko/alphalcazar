name: Alphalcazar

on:
  push:
    branches: [ master ]
  pull_request:
    branches:
      - 'master'
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

env:
  LINUX_IMGUI_PREREQUISITES: libgl1-mesa-dev libgl-dev libx11-xcb-dev libfontenc-dev libxaw7-dev libxcomposite-dev libxcursor-dev
                             libxdamage-dev libxfixes-dev libxi-dev libxinerama-dev libxmu-dev libxmuu-dev libxpm-dev libxrandr-dev
                             libxres-dev libxss-dev libxtst-dev libxv-dev libxxf86vm-dev libxcb-glx0-dev libxcb-render-util0-dev
                             libxcb-xkb-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-shape0-dev
                             libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-cursor-dev libxcb-dri2-0-dev
                             libxcb-dri3-dev libxcb-present-dev libxcb-composite0-dev libxcb-ewmh-dev libxcb-res0-dev libxcb-util-dev
                             libxcb-util0-dev, libxkbfile-dev, uuid-dev

jobs:
  test-cpp:
    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

        include:
          - os: windows-latest
            shell: powershell
            env_cc: cl.exe
            env_cxx: cl.exe

          - os: ubuntu-latest
            shell: bash
            env_cc: clang
            env_cxx: clang++
  
    name: Test (C++17 - ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
    - uses: actions/checkout@v2

    - name: Configure command prompt for MSVC++
      uses: ilammy/msvc-dev-cmd@v1
      if: matrix.os == 'windows-latest'

    - name: Install linux system dependencies
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update -q && sudo apt-get install -q -y $LINUX_IMGUI_PREREQUISITES

    - name: Setup Vulkan SDK
      uses: humbletim/setup-vulkan-sdk@v1.2.1
      with:
        vulkan-query-version: 1.4.313.0
        vulkan-components: Vulkan-Headers, Vulkan-Loader
        vulkan-use-cache: true
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: 3.11
    
    - name: Install latest conan 2 version
      run: |
        pip install --upgrade wheel
        pip install --upgrade "conan<3"
    
    - name: Install conan dependencies
      working-directory: ${{ github.workspace }}/cpp
      run: |
        conan profile detect
        conan install . -s build_type=Release -s compiler.cppstd=17 --build=missing --output-folder='${{ runner.temp }}/build/${{ runner.os }}'
    
    - name: Install CMake
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: "~3.24.0"
    
    - name: Build with CMake
      uses: lukka/run-cmake@v10
      env:
        CC: ${{ matrix.env_cc }}
        CXX: ${{ matrix.env_cxx }}
      with:
        buildDirectory: ${{ runner.temp }}/build/${{ runner.os }}
        cmakeListsTxtPath: '${{ github.workspace }}/cpp/CMakeLists.txt'
        configurePreset:  ${{ matrix.os == 'windows-latest' && 'conan-default' || 'conan-release' }}
        buildPreset: 'conan-release'
    
    - name: Run tests
      working-directory: ${{ runner.temp }}/build/${{ runner.os }}
      run: |
        ctest -C Release --timeout 600 -V

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.8
      uses: actions/setup-python@v6
      with:
        python-version: 3.8
    - name: Install dependencies
      working-directory: python_deprecated
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Test with pytest
      working-directory: python_deprecated
      run: |
        pytest
